[connectivity]
nk=HomGate:1:HomGate_1
nk=BRBack:1:BRBack_1
nk=BRFront:1:BRFront_1

# HBM memory mapping for HomGate
sp=HomGate_1.m00_axi:HBM[0]
sp=HomGate_1.m01_axi:HBM[1]
sp=HomGate_1.m02_axi:HBM[2]
sp=HomGate_1.m03_axi:HBM[3]
sp=HomGate_1.m04_axi:HBM[4]
sp=HomGate_1.m05_axi:HBM[5]
sp=HomGate_1.m06_axi:HBM[6]
sp=HomGate_1.m07_axi:HBM[7]
sp=HomGate_1.m08_axi:HBM[8]
sp=HomGate_1.m09_axi:HBM[9]
sp=HomGate_1.m10_axi:HBM[10]
sp=HomGate_1.m11_axi:HBM[11]
sp=HomGate_1.m12_axi:HBM[12]
sp=HomGate_1.m13_axi:HBM[20]
sp=HomGate_1.m14_axi:HBM[21]
sp=HomGate_1.m15_axi:HBM[22]
sp=HomGate_1.m16_axi:HBM[23]
sp=HomGate_1.m17_axi:HBM[24]
sp=HomGate_1.m18_axi:HBM[25]
sp=HomGate_1.m19_axi:HBM[26]
sp=HomGate_1.m20_axi:HBM[27]

# SLR placement
slr=HomGate_1:SLR0
slr=BRBack_1:SLR1
slr=BRFront_1:SLR2

# Stream connections
# HomGate → BRBack: IKS output (512-bit)
stream_connect=HomGate_1.axis00:BRBack_1.axis15
# BRBack → HomGate: final result (32-bit)
stream_connect=BRBack_1.axis16:HomGate_1.axis01
# HomGate → BRBack: BK data pass-through (8 × 512-bit, FIFO depth 4096)
stream_connect=HomGate_1.axis02:BRBack_1.axis06:4096
stream_connect=HomGate_1.axis03:BRBack_1.axis07:4096
stream_connect=HomGate_1.axis04:BRBack_1.axis08:4096
stream_connect=HomGate_1.axis05:BRBack_1.axis09:4096
stream_connect=HomGate_1.axis06:BRBack_1.axis10:4096
stream_connect=HomGate_1.axis07:BRBack_1.axis11:4096
stream_connect=HomGate_1.axis08:BRBack_1.axis12:4096
stream_connect=HomGate_1.axis09:BRBack_1.axis13:4096
# BRBack → BRFront: BK data forwarded (512-bit)
stream_connect=BRBack_1.axis14:BRFront_1.axis00:512
# BRFront → BRBack: globalout (32-bit)
stream_connect=BRFront_1.axis01:BRBack_1.axis17:512
# BRFront → BRBack: NTT output (4 × 512-bit)
# Pipeline ignores TREADY - need deep FIFOs to absorb SLR crossing latency
stream_connect=BRFront_1.axis02:BRBack_1.axis00:512
stream_connect=BRFront_1.axis03:BRBack_1.axis01:512
stream_connect=BRFront_1.axis04:BRBack_1.axis02:512
stream_connect=BRFront_1.axis05:BRBack_1.axis03:512
# BRBack → BRFront: AXISBRLater output (2 × 512-bit)
# Pipeline ignores TREADY - need deep FIFOs to absorb SLR crossing latency
stream_connect=BRBack_1.axis04:BRFront_1.axis06:512
stream_connect=BRBack_1.axis05:BRFront_1.axis07:512
# BRBack → HomGate: debug stream (32-bit, small FIFO)
stream_connect=BRBack_1.axis18:HomGate_1.axis10:16
